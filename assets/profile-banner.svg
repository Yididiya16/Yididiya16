<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350">

  <defs>

    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect
    width="1200"
    height="350"
    rx="30"
    fill="url(#background)"
  />

  <!-- Decorative circles -->
  <circle
    cx="100"
    cy="70"
    r="70"
    fill="#8b5cf6"
    opacity="0.15"
  />

  <circle
    cx="1100"
    cy="280"
    r="100"
    fill="#3b82f6"
    opacity="0.12"
  />

  <circle
    cx="1050"
    cy="60"
    r="35"
    fill="#a78bfa"
    opacity="0.18"
  />

  <circle
    cx="150"
    cy="290"
    r="35"
    fill="#60a5fa"
    opacity="0.15"
  />

  <!-- Greeting -->
  <text
    x="600"
    y="115"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#ffffff">
    Hi There, I'm
  </text>

  <!-- Name -->
  <text
    x="600"
    y="185"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="900"
    fill="url(#name)"
    filter="url(#glow)">
    Yididiya Beyene
  </text>

  <!-- Profession -->
  <text
    x="600"
    y="240"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="700"
    fill="#e2e8f0">
    Software Engineer
  </text>

  <!-- Decorative line -->
  <rect
    x="480"
    y="270"
    width="240"
    height="3"
    rx="2"
    fill="url(#name)"
  />

</svg>
