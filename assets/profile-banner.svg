<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="400"
     viewBox="0 0 1200 400">

  <defs>

    <!-- Dark background -->
    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0" stop-color="#030014"/>
      <stop offset="0.5" stop-color="#0b0520"/>
      <stop offset="1" stop-color="#020617"/>

    </linearGradient>


    <!-- Purple neon -->
    <linearGradient id="purple"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6366f1"/>

    </linearGradient>


    <!-- Blue neon -->
    <linearGradient id="blue"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#06b6d4"/>

    </linearGradient>


    <!-- Name -->
    <linearGradient id="name"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#67e8f9"/>

    </linearGradient>


    <!-- Glow -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="8"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- Strong glow -->
    <filter id="strongGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="15"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- Grid -->
    <pattern id="grid"
             width="50"
             height="50"
             patternUnits="userSpaceOnUse">

      <path
        d="M50 0H0V50"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.035"/>

    </pattern>

  </defs>


  <!-- Background -->

  <rect
    width="1200"
    height="400"
    rx="32"
    fill="url(#bg)"
  />


  <!-- Background grid -->

  <rect
    width="1200"
    height="400"
    rx="32"
    fill="url(#grid)"
  />


  <!-- Large purple glow -->

  <ellipse
    cx="150"
    cy="100"
    rx="300"
    ry="180"
    fill="#7c3aed"
    opacity="0.10"
    filter="url(#strongGlow)"
  />


  <!-- Large blue glow -->

  <ellipse
    cx="1050"
    cy="300"
    rx="300"
    ry="180"
    fill="#2563eb"
    opacity="0.10"
    filter="url(#strongGlow)"
  />


  <!-- Neon wave -->

  <path
    d="M-50 310
       C150 210 280 390 470 290
       S800 180 1250 300"
    fill="none"
    stroke="url(#purple)"
    stroke-width="3"
    opacity="0.8"
    filter="url(#glow)"
  />


  <!-- Second wave -->

  <path
    d="M-50 330
       C180 250 300 400 500 310
       S850 210 1250 280"
    fill="none"
    stroke="url(#blue)"
    stroke-width="2"
    opacity="0.7"
    filter="url(#glow)"
  />


  <!-- Third subtle wave -->

  <path
    d="M-50 350
       C180 280 320 420 540 330
       S900 250 1250 320"
    fill="none"
    stroke="#8b5cf6"
    stroke-width="1"
    opacity="0.35"
  />


  <!-- Floating particles -->

  <circle cx="100" cy="80" r="2" fill="#c084fc"/>
  <circle cx="180" cy="280" r="2" fill="#60a5fa"/>
  <circle cx="270" cy="60" r="1.5" fill="#ffffff"/>
  <circle cx="920" cy="80" r="2" fill="#67e8f9"/>
  <circle cx="1040" cy="150" r="1.5" fill="#ffffff"/>
  <circle cx="1120" cy="90" r="2" fill="#c084fc"/>
  <circle cx="850" cy="320" r="2" fill="#60a5fa"/>
  <circle cx="330" cy="330" r="1.5" fill="#ffffff"/>


  <!-- Center glass panel -->

  <rect
    x="250"
    y="65"
    width="700"
    height="230"
    rx="28"
    fill="#ffffff"
    fill-opacity="0.035"
    stroke="#ffffff"
    stroke-opacity="0.10"
  />


  <!-- Greeting -->

  <text
    x="600"
    y="125"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="600"
    fill="#e2e8f0">

    Hi There, I'm

  </text>


  <!-- Name -->

  <text
    x="600"
    y="200"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="60"
    font-weight="900"
    fill="url(#name)"
    filter="url(#glow)">

    Yididiya Beyene

  </text>


  <!-- Profession -->

  <text
    x="600"
    y="250"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="700"
    letter-spacing="2"
    fill="#cbd5e1">

   I'm Software Engineer

  </text>


  <!-- Accent -->

  <circle
    cx="470"
    cy="250"
    r="3"
    fill="#a78bfa"
    filter="url(#glow)"
  />

  <circle
    cx="730"
    cy="250"
    r="3"
    fill="#67e8f9"
    filter="url(#glow)"
  />


</svg>
